[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-health-agent"
version = "0.1.0"
description = "A dependency-free CLI for measuring local Git repository health"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "repo-health-agent contributors" }]

[project.scripts]
repo-health = "repo_health_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
